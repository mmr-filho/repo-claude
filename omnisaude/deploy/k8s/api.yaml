apiVersion: apps/v1
kind: Deployment
metadata:
  name: omnisaude-api
spec:
  replicas: 2
  selector: { matchLabels: { app: omnisaude-api } }
  template:
    metadata: { labels: { app: omnisaude-api } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000 }
      containers:
        - name: api
          image: omnisaude-api
          ports: [{ containerPort: 3001 }]
          envFrom:
            - configMapRef: { name: omnisaude-config }
            - secretRef: { name: omnisaude-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            periodSeconds: 30
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: '1', memory: 1Gi }
          volumeMounts:
            - { name: rnds-cert, mountPath: /certs, readOnly: true }
      volumes:
        # Certificado ICP-Brasil (e-CNPJ A1) para o mTLS da RNDS.
        - name: rnds-cert
          secret: { secretName: omnisaude-rnds-cert, optional: true }
---
apiVersion: v1
kind: Service
metadata:
  name: omnisaude-api
spec:
  selector: { app: omnisaude-api }
  ports: [{ port: 80, targetPort: 3001 }]
